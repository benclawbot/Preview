[package]
name = "preview"
version = "0.1.1"
description = "A cross-platform PDF and image viewer and editor"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "0.9", features = ["thread_safe"] }
lopdf = "0.46.0"
image = "0.25.10"
flate2 = "1"
anyhow = "1.0.104"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
base64 = "0.23.1"
tempfile = "3.27.0"
once_cell = "1.21.4"
little_exif = "0.6"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
resvg = "0.49"
rawloader = "0.37"
jpeg2k = "0.10"
openjpeg-sys = "1.0.12"
rand = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
libheif-rs = { version = "3", features = ["embedded-libheif"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
libheif-rs = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
